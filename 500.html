<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error - In.dl</title>
    
    <link rel="icon" type="image/png" href="my.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- CSS Architecture -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center;">
    <div class="void-stream" id="voidStream"></div>
    
    <div class="container max-w-sm">
        <h1 class="font-bold text-danger mb-sm" style="font-size: 5rem; text-shadow: 0 0 20px var(--danger);">500</h1>
        <h2 class="font-bold mb-md text-xl">Internal Server Error</h2>
        <p class="text-muted mb-xl">Oops! Something went wrong on our end. We're working on fixing it. Please try again later.</p>
        
        <a href="index.html" class="btn btn--outline btn--block">
            <i class="fas fa-redo mr-sm"></i> Return Home
        </a>
    </div>

    <!-- JavaScript Architecture -->
    <script src="js/ui.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            InUI.spawnParticles('voidStream', ['fa-bolt', 'fa-exclamation-triangle', 'fa-bug', 'fa-fire', 'fa-wrench']);
        });
    </script>
</body>
</html>
