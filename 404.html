<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - In.dl</title>
    
    <link rel="icon" type="image/png" href="my.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- CSS Architecture -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center;">
    <div class="void-stream" id="voidStream"></div>
    
    <div class="container max-w-sm">
        <h1 class="font-bold text-primary mb-sm" style="font-size: 5rem; text-shadow: 0 0 20px var(--primary);">404</h1>
        <h2 class="font-bold mb-md text-xl">Page Not Found</h2>
        <p class="text-muted mb-xl">Oops! It seems you've wandered into the void. The page you are looking for doesn't exist.</p>
        
        <a href="index.html" class="btn btn--primary btn--block">
            <i class="fas fa-home mr-sm"></i> Return Home
        </a>
    </div>

    <!-- JavaScript Architecture -->
    <script src="js/ui.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            InUI.initParticles(['fa-question', 'fa-map', 'fa-ghost', 'fa-compass', 'fa-search']);
        });
    </script>
</body>
</html>
